apiVersion: v1
kind: Namespace
metadata:
  name: triage-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-triage-agent
  namespace: triage-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-triage-agent-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-triage-agent-binding
subjects:
  - kind: ServiceAccount
    name: k8s-triage-agent
    namespace: triage-system
roleRef:
  kind: ClusterRole
  name: k8s-triage-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-triage-agent-data
  namespace: triage-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-triage-agent
  namespace: triage-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-triage-agent
  template:
    metadata:
      labels:
        app: k8s-triage-agent
    spec:
      serviceAccountName: k8s-triage-agent
      containers:
        - name: agent
          image: k8s-triage-agent:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DRY_RUN_REMEDIATION
              value: "true"
            - name: LLM_PROVIDER
              value: "ollama"
            - name: OLLAMA_BASE_URL
              value: "http://host.minikube.internal:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5-coder:7b"
          volumeMounts:
            - name: triage-data
              mountPath: /app/data
      volumes:
        - name: triage-data
          persistentVolumeClaim:
            claimName: k8s-triage-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-triage-agent
  namespace: triage-system
spec:
  selector:
    app: k8s-triage-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080